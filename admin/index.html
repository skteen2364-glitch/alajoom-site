<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>알아줌 관리자</title>
<link rel="icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14161F;--muted:#5B6070;--line:#E8E1D0;--ivory:#FBF7EE;--yellow:#FFD43B;--blue:#3B5B92;--ok:#12A150;--warn:#C2410C}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all}
header{position:sticky;top:0;z-index:5;background:rgba(251,247,238,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:var(--ink);text-decoration:none}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900}
.brand small{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:20px 20px 60px}
h1{font-size:24px;font-weight:900;margin:4px 0 2px;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.kpi.hl{background:var(--ink);border-color:var(--ink);color:#fff}.kpi.hl span{color:#C9CCD6}.kpi.hl b{color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.card h2{font-size:15.5px;font-weight:900;margin:0 0 12px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:13.5px}
.bar .t{height:12px;background:#F0EBDD;border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--blue);border-radius:9px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.cols div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.cols i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.cols.y i{background:#E0A800}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tools input{flex:1 1 220px;min-height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:15px;background:#fff}
.btn{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--yellow)}
.btn[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#FFF8E0;font-weight:800;position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 8px}
.tag.y{background:#E7F6EC;color:var(--ok)}.tag.n{background:#F2F2F2;color:#8A8F9C}
.gate{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
.gate h1{font-size:20px}
.kakao{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;width:100%;border:0;border-radius:12px;background:#FEE500;color:#191919;font:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px}
.note{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="in"><a class="brand" href="/"><i>알</i>알아줌<small>관리자</small></a><span id="who" class="note"></span></div></header>
<main id="main"><p class="note">불러오는 중…</p></main>
<script src="/assets/supabase-2.119.0.js"></script>
<script>
(function(){
  var URL_ = 'https://zuxbloxstkcixqpzqalk.supabase.co', KEY = 'sb_publishable_cZZ6cVbSIbkG93_rQ8jldg_f_Z9uOYH';
  var sb = window.supabase.createClient(URL_, KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } });
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var TYPE = { food:'음식점', cafe:'카페', bakery:'베이커리', pilates:'필라테스·요가', beau:'피부관리', nail:'네일', hair:'미용실', funi:'가구', flower:'꽃집', pet:'애견미용', etc:'기타', '미입력':'미입력' };
  var TOOL = { photo:'사진 홍보', post:'홍보글', card:'안내 카드', sms:'문자', review:'리뷰 답글', set:'AI 직원 세트', voice:'말투 배우기', board:'메뉴판', pop:'가격표', insta:'인스타', blog:'블로그', other:'기타' };
  var MATE = { pilates:'필라테스메이트', food:'푸드메이트', beau:'뷰메이트' };
  var D = null, q = '', onlyMkt = false;

  function gate(title, body, login){
    $('#main').innerHTML = '<div class="gate"><h1>' + title + '</h1><p class="note">' + body + '</p>' + (login ? '<button class="kakao" id="login">카카오로 로그인</button>' : '<a class="btn" href="/" style="display:inline-flex;align-items:center;margin-top:12px;text-decoration:none">알아줌 홈으로</a>') + '</div>';
    if (login) $('#login').onclick = function(){ sb.auth.signInWithOAuth({ provider:'kakao', options:{ redirectTo: location.origin + '/admin/' } }); };
  }
  async function load(){
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return gate('관리자 로그인', '관리자 계정으로 로그인해 주세요.', true);
    $('#who').textContent = (s.user.email || '') + ' · ';
    var lo = document.createElement('button'); lo.className = 'btn'; lo.textContent = '로그아웃'; lo.style.minHeight = '34px'; lo.onclick = async function(){ await sb.auth.signOut(); location.reload(); }; $('#who').appendChild(lo);
    var r = await fetch(URL_ + '/functions/v1/admin', { method:'POST', headers:{ 'Content-Type':'application/json', apikey: KEY, Authorization:'Bearer ' + s.access_token }, body:'{}' });
    if (r.status === 403) return gate('관리자만 볼 수 있어요', '이 계정에는 관리자 권한이 없어요.', false);
    if (!r.ok) return gate('잠시 후 다시 열어 주세요', '데이터를 불러오지 못했어요.', false);
    D = await r.json(); render();
  }
  function bars(list, map, color){
    if (!list || !list.length) return '<p class="empty">아직 데이터가 없어요</p>';
    var max = Math.max.apply(null, list.map(function(x){ return x[1]; })) || 1;
    return '<div class="bars">' + list.slice(0, 10).map(function(x){ return '<div class="bar"><span>' + esc((map && map[x[0]]) || x[0]) + '</span><span class="t"><i style="width:' + Math.max(3, x[1] / max * 100) + '%;' + (color ? 'background:' + color : '') + '"></i></span><b>' + x[1] + '</b></div>'; }).join('') + '</div>';
  }
  function cols(obj, cls){
    var days = [], t = new Date(); for (var i = 29; i >= 0; i--){ var d = new Date(t.getTime() - i * 864e5 + 9 * 3600e3); days.push(d.toISOString().slice(0, 10)); }
    var vals = days.map(function(d){ return obj[d] || 0; }), max = Math.max.apply(null, vals) || 1, sum = vals.reduce(function(a, b){ return a + b; }, 0);
    return '<p class="note" style="margin:-6px 0 8px">최근 30일 합계 <b style="color:var(--ink)">' + sum + '</b></p><div class="cols ' + (cls || '') + '">' + vals.map(function(v, i){ return '<div title="' + days[i] + ' · ' + v + '"><i style="height:' + (v ? Math.max(4, v / max * 100) : 0) + '%"></i></div>'; }).join('') + '</div><div class="axis"><span>' + days[0].slice(5).replace('-', '/') + '</span><span>오늘</span></div>';
  }
  function fdate(s){ if (!s) return '-'; var d = new Date(s); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function rows(){
    return D.members.filter(function(m){
      if (onlyMkt && !m.marketing) return false;
      if (q && [m.email, m.store_name, m.area, TYPE[m.business_type]].join(' ').toLowerCase().indexOf(q.toLowerCase()) < 0) return false;
      return true;
    });
  }
  function table(){
    var rs = rows();
    $('#cnt').textContent = rs.length + '명';
    $('#tbody').innerHTML = rs.length ? rs.map(function(m){ return '<tr><td>' + fdate(m.joined) + '</td><td>' + esc(m.email) + '</td><td>' + esc(m.store_name || '-') + '</td><td>' + esc(TYPE[m.business_type] || '-') + '</td><td>' + esc(m.area || '-') + '</td><td>' + (m.marketing ? '<span class="tag y">동의</span>' : '<span class="tag n">-</span>') + '</td><td class="num">' + m.uses30 + '</td><td>' + fdate(m.last_login) + '</td></tr>'; }).join('') : '<tr><td colspan="8" class="empty" style="text-align:center">해당하는 회원이 없어요</td></tr>';
  }
  function csv(mktOnly){
    var rs = D.members.filter(function(m){ return !mktOnly || m.marketing; });
    var head = ['가입일', '이메일', '가게 이름', '업종', '지역', '마케팅 동의', '동의 시각', '최근 30일 AI 사용', '마지막 로그인'];
    var cell = function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [head].concat(rs.map(function(m){ return [m.joined, m.email, m.store_name, TYPE[m.business_type] || '', m.area, m.marketing ? '동의' : '', m.marketing_at || '', m.uses30, m.last_login || '']; }));
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.map(function(r){ return r.map(cell).join(','); }).join('\r\n')], { type:'text/csv;charset=utf-8' }));
    a.download = '알아줌_' + (mktOnly ? '마케팅동의자' : '회원') + '_' + D.today + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
  function render(){
    var T = D.totals;
    var k = function(n, l, hl){ return '<div class="kpi' + (hl ? ' hl' : '') + '"><span>' + l + '</span><b>' + n + '</b></div>'; };
    var h = '<h1>오늘의 알아줌</h1><p class="sub">' + D.today + ' 기준 · 회원 데이터는 관리자만 볼 수 있어요. 마케팅 메일은 <b>동의한 회원</b>에게만 보내 주세요.</p>';
    h += '<div class="kpis">' + k(T.members, '전체 회원', true) + k(T.today_joins, '오늘 가입') + k(T.onboarded, '가게 정보 입력') + k(T.marketing, '마케팅 동의') + k(T.active_7, '최근 7일 AI 쓴 회원') + k(T.uses_today, '오늘 AI 사용') + k(T.uses_30, '30일 AI 사용') + '</div>';
    h += '<div class="grid"><div class="card"><h2>가입 추이</h2>' + cols(D.joins_by_day) + '</div><div class="card"><h2>AI 사용 추이</h2>' + cols(D.uses_by_day, 'y') + '</div></div>';
    h += '<div class="grid"><div class="card"><h2>업종별 회원</h2>' + bars(D.by_type, TYPE) + '</div><div class="card"><h2>지역별 회원 <small class="note">상위 15</small></h2>' + bars(D.by_area) + '</div>';
    h += '<div class="card"><h2>많이 쓰는 기능 <small class="note">최근 30일</small></h2>' + bars(D.by_tool, TOOL, '#E0A800') + '</div><div class="card"><h2>메이트별 사용 <small class="note">최근 30일</small></h2>' + bars(D.by_mate, MATE, '#2E4877') + '</div></div>';
    h += '<div class="card"><h2>회원 목록 <small class="note" id="cnt"></small></h2><div class="tools"><input id="q" type="search" placeholder="이메일·가게 이름·업종·지역 찾기"><button class="btn" id="mk" aria-pressed="false">마케팅 동의자만</button><button class="btn" id="csvAll">엑셀(전체)</button><button class="btn pri" id="csvMk">엑셀(마케팅 동의자)</button></div>';
    h += '<div class="tw"><table><thead><tr><th>가입</th><th>이메일</th><th>가게</th><th>업종</th><th>지역</th><th>마케팅</th><th>30일 AI</th><th>마지막 로그인</th></tr></thead><tbody id="tbody"></tbody></table></div>';
    h += '<p class="note" style="margin:10px 0 0">엑셀 파일에는 개인정보가 들어 있어요. 필요한 곳에만 쓰고 보관에 주의해 주세요.</p></div>';
    $('#main').innerHTML = h;
    $('#q').oninput = function(){ q = this.value.trim(); table(); };
    $('#mk').onclick = function(){ onlyMkt = !onlyMkt; this.setAttribute('aria-pressed', onlyMkt); table(); };
    $('#csvAll').onclick = function(){ csv(false); };
    $('#csvMk').onclick = function(){ csv(true); };
    table();
  }
  load().catch(function(){ gate('잠시 후 다시 열어 주세요', '데이터를 불러오지 못했어요.', false); });
})();
</script>
</body>
</html>
