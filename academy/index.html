<!DOCTYPE html>
<html lang="ko">
<head><script>if(location.hostname==='www.alajoom.com')location.replace('https://alajoom.com'+location.pathname+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학원메이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 알아줌 브랜드: 차분한 블루 + 노랑 포인트, 아이보리 바탕. 모바일 한 손 사용 기준 단일 열 앱 */
  --blue:#2A7A57; --blue-deep:#1F5F45; --blue-tint:#E2F2E9;
  --yellow:#FFD43B; --ivory:#FBF7EE; --ink:#14161F; --muted:#5B6070; --line:#E8E1D0;
  --ok:#12A150; --warn:#C2410C; --warn-tint:#FFF1E8;
  --font:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--font);line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:0;z-index:5;background:var(--ivory);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px 12px 12px 4px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted)}
.quota{font-size:12px;font-weight:700;color:var(--blue-deep);background:var(--blue-tint);padding:5px 10px;border-radius:999px;white-space:nowrap}
.studio{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.studio .av{width:40px;height:40px;border-radius:50%;background:var(--blue-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue)}
.studio>div:not(.av){flex:1;min-width:0}
.studio b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.studio span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:8px 4px;white-space:nowrap}
h1{margin:6px 0 0;font-size:22px;font-weight:900;letter-spacing:-.6px;line-height:1.35;text-wrap:balance}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool.wide{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0;gap:12px;border-color:var(--blue);background:var(--blue-tint)}
.tool.wide[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue) inset}
.setc{flex:none;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer}
.setc[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--yellow)}
.tool.hero{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0;gap:14px;background:var(--ink);color:#fff;border-color:var(--ink)}
.tool.hero .ic{background:var(--yellow);color:var(--ink);width:44px;height:44px;flex-shrink:0}
.tool.hero span{color:#C9CFDB}
.tool.hero[aria-pressed="true"]{box-shadow:0 0 0 3px var(--yellow) inset}
.alt-pick{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.alt-pick input{font-size:14px;max-width:100%}
.file-cover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #CFC5AE;border-radius:16px;padding:26px 12px;background:var(--ivory);text-align:center;cursor:pointer}
.drop b{font-size:15px}.drop span{font-size:12.5px;color:var(--muted)}
.ph-wrap{position:relative}
.ph-wrap img{width:100%;display:block;border-radius:14px;border:1px solid var(--line);background:#eee}
.hold{position:absolute;right:10px;top:10px;border:0;border-radius:999px;background:rgba(20,22,31,.75);color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;touch-action:none;-webkit-user-select:none;user-select:none}
.tag{display:inline-block;margin-top:8px;border-radius:999px;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:900;padding:5px 10px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.sl{display:grid;grid-template-columns:56px 1fr 34px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.sl input{width:100%;accent-color:var(--blue)}
.sl output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out-c{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;position:relative}
.out-c[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.out-c b{font-size:14px}.out-c span{font-size:12px;color:var(--muted);line-height:1.4}
.out-c em{align-self:flex-start;margin-bottom:2px;font-style:normal;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:999px;background:#EAF6EF;color:#0B6B3A}
.out-c em.soon{background:#F1EEE6;color:#7A7365}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--yellow);font-size:11px;font-weight:900;margin-right:6px}
.soon-box{border:1px dashed #CFC5AE;border-radius:14px;background:var(--ivory);padding:16px;display:flex;flex-direction:column;gap:8px}
.soon-box b{font-size:15px}.soon-box p{margin:0;font-size:13px;color:var(--muted)}
.ex{display:flex;flex-wrap:wrap;gap:6px}.ex span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.tool{text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:116px;transition:transform .15s ease,border-color .15s ease}
.tool:active{transform:scale(.98)}
.tool[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.tool .ic{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--yellow);display:flex;align-items:center;justify-content:center}
.tool b{font-size:15px;line-height:1.3}
.tool span{font-size:12px;color:var(--muted);line-height:1.4;display:block}
.tool.hero b{display:block;font-size:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.4px}
.step{display:flex;flex-direction:column;gap:8px}
.step>label,.step>p{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:700;color:#3A3F4C}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;background:#fff}
textarea{min-height:88px;resize:vertical}
.go{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:16px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.go:disabled{opacity:.55}
.result{display:flex;flex-direction:column;gap:10px}
.out{white-space:pre-wrap;background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;line-height:1.7;min-height:80px}
.out.thinking{color:var(--muted)}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;border-radius:12px;padding:10px 12px;background:#EAF6EF;color:#0B6B3A;font-weight:700}
.check.bad{background:var(--warn-tint);color:var(--warn)}
.check ul{margin:4px 0 0;padding-left:18px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sub{flex:1 1 0;min-width:96px;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:44px;font-size:14px;font-weight:700;padding:0 10px}
.sub.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s ease;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.card-prev{width:100%;border-radius:16px;border:1px solid var(--line);display:block;background:#eee}
.themes{display:flex;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue)}
.fields{display:grid;gap:8px}
dialog{border:0;border-radius:22px;padding:0;width:min(440px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(20,22,31,.45)}
.dlg{padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px;font-weight:900}
.dlg label{font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.mode{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
.hidden{display:none !important}
#v-make{display:flex;flex-direction:column;gap:14px}
.mtabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
.mtab{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font:inherit;font-size:14px;padding:0 4px;white-space:nowrap;font-weight:800;color:var(--muted);cursor:pointer}
.mtab[aria-selected=true]{background:var(--ink);color:var(--yellow)}
#mbDlg input[type=text],#mbDlg textarea{font-size:16px}


/* ---------- v2: 첫 화면 히어로 · 템플릿 고르기 · 도구 색 ---------- */
section.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 18px;background:linear-gradient(135deg,var(--blue) 0%,var(--blue-deep) 100%);color:#fff;margin:2px 0 12px;box-shadow:0 14px 30px -18px var(--blue-deep)}
section.hero::before,section.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
section.hero::before{width:230px;height:230px;right:-80px;top:-90px;background:rgba(255,255,255,.12)}
section.hero::after{width:110px;height:110px;right:34px;top:62px;background:rgba(255,212,59,.24)}
section.hero>*{position:relative;z-index:1}
section.hero .hero-d{margin:0;font-size:13px;opacity:.88}
section.hero h1{color:#fff;font-size:25px;margin:4px 0 6px;line-height:1.3}
section.hero .hero-s{margin:0 0 16px;font-size:13.5px;opacity:.92}
.hero-b{display:flex;gap:8px;flex-wrap:wrap}
.hero-b button{min-height:50px;border-radius:14px;border:0;font:inherit;font-weight:900;font-size:15px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s ease}
.hero-b button:active{transform:scale(.97)}
.hero-b .hb1{background:var(--yellow);color:var(--ink);flex:1 1 100%;font-size:16.5px;min-height:56px}
.hero-b .hb2{background:rgba(255,255,255,.14);color:#fff;flex:1 1 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38)}
.tpl-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tpl{flex:none;width:92px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;cursor:pointer}
.tpl img{width:92px;min-height:70px;object-fit:cover;border-radius:12px;border:2px solid #fff;background:#EEE9DD;box-shadow:0 1px 6px rgba(20,22,31,.12);transition:transform .12s ease}
.tpl:active img{transform:scale(.96)}
.tpl[aria-pressed="true"] img{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.tpl span{font-size:12.5px;font-weight:800;color:#3A3F4C;white-space:nowrap}
.tpl[aria-pressed="true"] span{color:var(--blue)}
.step>p small{color:var(--muted);font-weight:500}
.tool .ic{width:44px;height:44px;border-radius:14px}
.tool b{font-size:16px}
.tool[data-tool=set] .ic{background:var(--yellow);color:var(--ink)}
.tool[data-tool=post] .ic{background:#EDE9FE;color:#6D28D9}
.tool[data-tool=card] .ic{background:#DCFCE7;color:#15803D}
.tool[data-tool=sms] .ic{background:#E0F2FE;color:#0369A1}
.tool[data-tool=review] .ic{background:#FEF3C7;color:#B45309}
.tool[data-tool=board] .ic,.tool[data-tool=pop] .ic{background:#FFE4E6;color:#BE123C}
.tool.hero{background:linear-gradient(135deg,#14161F,#2E3240)}
header .brand{cursor:pointer;border-radius:12px}
header .brand:active{opacity:.7}
@media (min-width:900px){section.hero{padding:28px 30px 24px}section.hero h1{font-size:30px}.hero-b .hb1{flex:0 1 300px}.hero-b .hb2{flex:0 1 180px}.tpl{width:110px}.tpl img{width:110px}}


/* ---------- v3: 시안 A·B·C 섞기 ---------- */
.hd-date{margin:4px 0 6px;font-size:13px;color:var(--muted)}
.hd-note{display:inline-block;color:var(--blue)}
.hd-h1{font-family:'Gaegu',Pretendard,var(--font);font-size:35px;line-height:1.18;font-weight:700;letter-spacing:-.11em;word-spacing:-.12em;margin:0 0 14px;text-wrap:balance;color:var(--ink)}
.tl{list-style:none;margin:0 0 4px;padding:0}
.tl li{display:flex;gap:16px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line)}
.tl-t{flex:none;width:62px;font-family:'Gaegu',Pretendard,var(--font);font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tl li:first-child .tl-t{color:var(--blue)}
.tl-m{display:flex;flex-direction:column;gap:2px;font-size:15.5px;min-width:0}.tl-m b{font-weight:700}.tl-m small{font-size:12.5px;color:var(--muted)}
.hd-sum{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 18px;padding-top:4px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.hd-sum button{border:0;background:none;font:inherit;font-weight:800;color:var(--blue);min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;flex:none}
.hp{position:relative;height:300px;border-radius:24px;overflow:hidden;margin:4px 0 20px;background:var(--blue-tint)}
.hp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,16,0) 35%,rgba(20,14,16,.74) 100%)}
.hp-tag{position:absolute;top:12px;left:12px;z-index:1;font-size:11.5px;font-weight:700;color:#fff;background:rgba(20,14,16,.5);padding:5px 10px;border-radius:999px}
.hp-in{position:absolute;left:16px;right:16px;bottom:16px;z-index:1}
.hp-in h2{margin:0 0 12px;color:#fff;font-size:22px;line-height:1.3;font-weight:900}
.hp-b{display:flex;gap:8px}
.hp1{flex:1;min-height:50px;border:0;border-radius:14px;background:var(--yellow);color:var(--ink);font:inherit;font-size:15px;font-weight:900;cursor:pointer}
.hp2{min-height:50px;padding:0 14px;border:0;border-radius:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);color:#fff;font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.hbar{position:sticky;bottom:14px;z-index:5;display:flex;gap:8px;margin-top:18px}
.hb-go{flex:1;min-height:56px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-size:16.5px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 26px -12px var(--blue-deep);cursor:pointer;transition:transform .12s ease}
.hb-ic{width:56px;flex:none;min-height:56px;border:0;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 26px -14px rgba(20,14,16,.8);transition:transform .12s ease}
.hb-go:active,.hb-ic:active,.hp1:active,.hp2:active{transform:scale(.97)}
.qask{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
.qask label{font-size:13px;color:var(--muted)}
.qbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px}
.qbox:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint)}
.qbox input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;background:transparent;color:var(--ink);padding:10px 0}
.qmic{width:46px;height:46px;flex:none;border:0;border-radius:12px;background:var(--blue-tint);color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer}
.qlab{margin:0 0 10px;font-size:15px;font-weight:900}
#v-make .tools{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
#v-make .tool{flex:none;width:132px;min-height:0;padding:0;border:0;background:none;gap:8px;scroll-snap-align:start;box-shadow:none;border-radius:16px;color:var(--ink)}
#v-make .tool:hover{transform:none}
#v-make .tool b{font-size:14px;font-weight:800;padding-left:2px}
#v-make .tool[aria-pressed="true"] b{color:var(--blue)}
.pv{display:block;width:132px;height:156px;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 8px 18px -12px rgba(20,14,16,.5);transition:transform .12s ease,box-shadow .12s ease}
#v-make .tool:active .pv{transform:scale(.96)}
#v-make .tool[aria-pressed="true"] .pv{box-shadow:0 0 0 3px var(--blue),0 8px 18px -12px rgba(20,14,16,.5)}
.pv *{box-sizing:border-box}
@media (min-width:900px){.hd-h1{font-size:36px}.hp{height:340px}#v-make .tool{width:150px}.pv{width:150px;height:176px}}


/* ---------- v4: 사진 보정 ---------- */
.rt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rt-grid button{position:relative;aspect-ratio:1/1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--blue-tint) center/cover no-repeat;cursor:pointer}
.rt-grid button span{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.rt-row{display:flex;flex-wrap:wrap;gap:8px}
.rt-row .sub{flex:1 1 140px}
.att-fix{position:absolute;left:8px;top:8px;min-height:36px;padding:0 12px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer}
.ret-bar{position:sticky;bottom:12px;z-index:5;display:flex;gap:8px}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* ---------- PC 넓은 화면: 왼쪽 메뉴 + 오른쪽 내용 ---------- */
@media (min-width: 900px){
  .app{max-width:1160px;display:grid;grid-template-columns:280px minmax(0,1fr);column-gap:28px;row-gap:14px;align-items:start;padding:0 28px 56px}
  .app > header{grid-column:1 / -1}
  .app > .studio{grid-column:1;grid-row:2}
  .app > .mtabs{grid-column:1;grid-row:3;display:flex;flex-direction:column;gap:4px;position:sticky;top:78px}
  .app > .mtabs > button{text-align:left;padding:0 16px;min-height:48px;font-size:15px}
  .app > .mode{grid-column:1;text-align:left}

    var weekPost = wLoad().filter(function(w){ return Date.now() - new Date(w.updated).getTime() < 7 * 864e5 && /post|photo|set|card/.test(w.tool); }).length;
    if (!weekPost) todo.push('<li style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><span style="flex:none;font-size:11px;font-weight:800;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 7px">홍보</span><span style="flex:1;min-width:0;font-size:14px">이번 주 홍보글이 아직 없어요</span><button type="button" class="sub primary" data-hgo="set" style="flex:none;min-width:0;min-height:36px;padding:0 12px;font-size:12.5px">만들기</button></li>');
    h += '<section class="panel" style="padding:14px 16px"><h2 style="margin:0 0 4px;font-size:16px">챙길 일 ' + (todo.length ? '<small style="color:var(--muted);font-weight:500">' + todo.length + '개</small>' : '') + '</h2>' + (todo.length ? '<ul style="list-style:none;margin:0;padding:0">' + todo.join('') + '</ul>' : '<p style="margin:6px 0 0;font-size:14px;color:var(--muted)">오늘 챙길 일이 없어요. 여유로운 하루 보내세요!</p>') + '</section>';
    // 최근 작업
    var rec = wLoad().slice(0, 3);
    if (rec.length) h += '<section class="panel" style="padding:14px 16px"><h2 style="margin:0 0 6px;font-size:16px">최근 작업</h2>' + rec.map(function(w){ return '<button type="button" data-wopen="' + w.id + '" style="display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;font:inherit;text-align:left;cursor:pointer"><span style="flex:none;font-size:11px;font-weight:800;color:var(--muted);background:var(--ivory);border-radius:8px;padding:3px 7px">' + TNAME[w.tool] + '</span><span style="flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(wTitle(w)) + '</span><span style="flex:none;font-size:12.5px;font-weight:800;color:var(--blue)">이어서</span></button>'; }).join('') + '</section>';
    h += '<button type="button" onclick="window.alajoomFeedback&&window.alajoomFeedback(\'academy\')" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;margin:14px 0 4px;border:1px dashed var(--line,#E6E8ED);border-radius:14px;background:transparent;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted,#5B6070);cursor:pointer">불편한 점·바라는 기능 알려주기</button>';
    h += '<div class="hbar"><button type="button" class="hb-go" data-hgo="set">' + IC3.spark + '오늘 홍보 만들기</button><button type="button" class="hb-ic" data-hgo="photo" aria-label="사진으로 홍보">' + IC3.cam + '</button><button type="button" class="hb-ic" data-hvoice="1" aria-label="말로 시키기">' + IC3.mic + '</button></div>';
    box.innerHTML = h;
    if (pw) phGet(pw.id).then(function(b){ var im = document.getElementById('hpImg'); if (b && im){ if (window._hpUrl) URL.revokeObjectURL(window._hpUrl); window._hpUrl = URL.createObjectURL(b); im.src = window._hpUrl; } }).catch(function(){});
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-home],[data-hgo],[data-hsms],[data-hvoice],[data-hcls]'); if (!t) return;
    if (t.dataset.hcls){ if (window.alajoomOpenAtt && window.alajoomTodayClasses && window.alajoomTodayClasses().length){ window.alajoomOpenAtt(); return; } window.alajoomTab('members'); var sb = document.querySelector('#v-members [data-m="sub"][data-v="cls"]'); if (sb) sb.click(); return; }
    if (t.dataset.home && window.alajoomTab) return window.alajoomTab(t.dataset.home);
    if (t.dataset.hsms && window.alajoomMemberSms) return window.alajoomMemberSms(t.dataset.hsms);
    if (t.dataset.hvoice) return vOpen();
    if (t.dataset.hgo){ window.alajoomTab('make'); var b = document.querySelector('.tool[data-tool="' + t.dataset.hgo + '"]'); if (b) b.click(); }
  });
  window.addEventListener('alajoom:tab', function(e){ if (e.detail === 'home') renderHome(); });
  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', async function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.tool){ if (e.isTrusted) window.alajoomRecipient = null; tool = t.dataset.tool; document.querySelectorAll('.tool').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); renderPanel(); $('#panel').scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if (t.classList.contains('chip') && t.dataset.k){ if (tool === 'card' && t.dataset.k === 'topic' && t.dataset.v === '이번 주 시간표' && window.alajoomWeekSchedule && $('#detail') && !$('#detail').value.trim()){ var ws = window.alajoomWeekSchedule(); if (ws){ $('#detail').value = ws; toast('시간표를 넣었어요'); } } pick[t.dataset.k] = t.dataset.v; t.parentNode.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); return; }
    if (t.id === 'go'){ curWork = null; return generate(); }
    if (t.dataset.chm){ var c = t.dataset.chm, i = setSel.indexOf(c); if (i >= 0) setSel.splice(i, 1); else setSel.push(c); t.setAttribute('aria-pressed', i < 0); return; }
    if (t.dataset.setc){ if (setRes && $('#out')) setRes[setCur] = $('#out').innerText; setCur = t.dataset.setc; showSet(''); return; }
    if (t.dataset.act === 'igpost' || t.dataset.act === 'nppost' || t.dataset.act === 'igcard') return postTo(t.dataset.act);
    if (t.dataset.act === 'kakao' || t.dataset.act === 'smsapp') return sendMsg(t.dataset.act);
    if (t.dataset.act === 'attdel'){ att = null; renderAtt(); if (tool === 'card' && lastCard && !$('#result').classList.contains('hidden')){ showCard(lastCard); } return; }
    if (t.dataset.out){ ph.out = t.dataset.out; document.querySelectorAll('.out-c').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.out === ph.out); }); showOut(); return; }
    if (t.dataset.pre){ applyPreset(t.dataset.pre); return; }
    if (t.dataset.ratio){ ph.ratio = t.dataset.ratio; t.parentNode.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); draw(); return; }
    if (t.dataset.act === 'phnew'){ $('#drop').classList.remove('hidden'); if ($('#altPick')) $('#altPick').classList.remove('hidden'); $('#drop').scrollIntoView({behavior:'smooth', block:'center'}); toast('위 칸을 눌러 사진을 골라주세요'); return; }
    if (t.dataset.act === 'phsave'){
      var b = await photoBlob(2160, .92);
      if (downloads){ try { await downloads.save({filename:(studio.name || CFG.title) + '_사진.jpg', data:b}); toast('저장했어요'); } catch(err){ toast(err && err.code === 'declined' ? '저장을 취소했어요' : '사진을 길게 눌러 저장해 주세요'); } }
      else { saveBlob(b, (studio.name || CFG.title) + '_보정사진.jpg'); if (lastText) saveWork(); }
      return;
    }
    var act = t.dataset.act;
    if (act === 'copy'){ try { await navigator.clipboard.writeText(lastText); toast('복사했어요. 붙여 넣기만 하세요'); } catch(err){ toast('글을 길게 눌러 복사해 주세요'); } }
    if (act === 'fix'){ showText(autofix(lastText), false); toast('주의 표현을 바꿨어요'); }
    if (act === 'again') generate();
    if (act === 'short') generate('\n추가 요청: 지금보다 절반 길이로 더 짧게.');
    if (t.dataset.th){ theme = +t.dataset.th; t.parentNode.querySelectorAll('[data-th]').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); if (lastCard && $('#result') && !$('#result').classList.contains('hidden')){ readCardInputs(); showCard(lastCard); } }
    if (t.dataset.cfmt){ cfmt = t.dataset.cfmt; readCardInputs(); showCard(lastCard); }
    if (t.dataset.flt){ ph.filter = t.dataset.flt; document.querySelectorAll('[data-flt]').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); draw(); return; }
    if (t.dataset.frm){ ph.frame = t.dataset.frm; document.querySelectorAll('[data-frm]').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); draw(); return; }
    if (act === 'redraw'){ readCardInputs(); showCard(lastCard); toast('카드에 반영했어요'); }
    if (act === 'save' && !downloads){ readCardInputs(); drawCard(lastCard).toBlob(function(b){ saveBlob(b, (studio.name || CFG.title) + '_안내카드.png'); }, 'image/png'); }
    if (act === 'save' && downloads){
      readCardInputs(); var cv = drawCard(lastCard);
      cv.toBlob(async function(b){ try { await downloads.save({filename:(studio.name || CFG.title) + '_안내카드.png', data:b}); toast('저장했어요'); } catch(err){ toast(err && err.code === 'declined' ? '저장을 취소했어요' : '이미지를 길게 눌러 저장해 주세요'); } }, 'image/png');
    }
  });
  function readCardInputs(){ if (!lastCard || !$('#cTitle')) return; lastCard.title = $('#cTitle').value.split(/\s*\/\s*/).join('\n'); lastCard.lines = Array.prototype.map.call(document.querySelectorAll('.cLine'), function(i){ return i.value.trim(); }).filter(Boolean); }

  /* 스튜디오 정보 */
  var dlg = $('#dlg'), toneSel = studio.tone;
  $('#fTone').innerHTML = TONES.map(function(t){ return '<button type="button" class="chip" data-tone="' + t + '" aria-pressed="false">' + t + '</button>'; }).join('');
  $('#fTone').addEventListener('click', function(e){ var b = e.target.closest('[data-tone]'); if (!b) return; toneSel = b.dataset.tone; this.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', c === b); }); });
  $('#editStudio').addEventListener('click', function(){
    $('#fName').value = studio.name; $('#fArea').value = studio.area; $('#fClass').value = studio.cls; $('#fFeat').value = studio.feat; $('#fContact').value = studio.contact; toneSel = studio.tone;
    $('#fTone').querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', c.dataset.tone === toneSel); });
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  });
  $('#voiceLearn').addEventListener('click', voiceSheet);
  setTimeout(voiceRefresh, 1500);
  $('#stCancel').addEventListener('click', function(){ dlg.close ? dlg.close() : dlg.removeAttribute('open'); });
  $('#stForm').addEventListener('submit', function(e){
    e.preventDefault();
    studio = { name:$('#fName').value.trim() || '우리 가게', area:$('#fArea').value.trim(), cls:$('#fClass').value.trim(), feat:$('#fFeat').value.trim(), contact:$('#fContact').value.trim() || '전화 문의', tone:toneSel };
    store.set('studio', studio); renderStudio(); dlg.close ? dlg.close() : dlg.removeAttribute('open'); toast('저장했어요');
    try { window.dispatchEvent(new CustomEvent('alajoom:studio-saved', {detail: studio})); } catch(err){}
  });

  /* 로그인 회원의 가게 정보(서버) ↔ 이 화면 */
  window.addEventListener('alajoom:profile', function(e){
    var p = e.detail || {}, saved = store.get('studio', null), local = saved && saved.name && saved.name !== CFG.studio.name;
    if (p.studio && p.studio.name){ studio = p.studio; }
    else if (local){ try { window.dispatchEvent(new CustomEvent('alajoom:studio-saved', {detail: saved})); } catch(err){} return; }
    else if (p.store_name){ studio = { name:p.store_name, area:p.area || '', cls:'', feat:'', contact:'', tone:(saved && saved.tone) || CFG.studio.tone }; toast('가입 때 적은 가게 정보를 불러왔어요'); }
    else return;
    store.set('studio', studio); renderStudio();
  });
  renderStudio(); renderQuota(); renderPanel();
  $('#mode').textContent = CFG.offline;
  if (window.claude && window.claude.use){
    window.claude.use('sample').then(function(s){ sample = s; $('#mode').textContent = s ? '알아줌이 연결돼 있어요 · 시제품' : CFG.offline; }).catch(function(){});
    window.claude.use('downloads').then(function(d){ downloads = d; }).catch(function(){});
  }

  /* 왼쪽 위 메이트 이름을 누르면 첫 화면으로 */
  (function(){ var br = document.querySelector('header .brand'); if (!br) return; br.setAttribute('role', 'button'); br.setAttribute('tabindex', '0'); br.setAttribute('aria-label', CFG.title + ' 첫 화면으로');
    var goHome = function(){ if (window.alajoomTab) window.alajoomTab('home'); try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){ window.scrollTo(0, 0); } };
    br.addEventListener('click', goHome); br.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goHome(); } }); })();
})();
</script>
</body>
</html>
