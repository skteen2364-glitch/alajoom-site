var G={market:['시장','#DDF3F6','#0B7285'],food:['식당','#FFE8D9','#C2410C'],cafe:['카페','#F3E8DC','#7C4A1E'],beauty:['뷰티','#FCE4EE','#BE185D'],fit:['운동','#ECE7FC','#5B3FD1'],edu:['학원','#E2ECFB','#2F5DA8'],etc:['가게','#F1F2F5','#5B6070']};
var CAT={fish:['market','수산'],meat:['market','정육'],fruit:['market','청과'],side:['market','반찬'],rice:['market','떡·방앗간'],snack:['market','분식'],dry:['market','건어물'],etc:['market',''],food:['food',''],cafe:['cafe',''],bakery:['cafe','베이커리'],skin:['beauty','피부관리'],nail:['beauty','네일'],hair:['beauty','헤어'],beau:['beauty',''],pilates:['fit','필라테스'],academy:['edu',''],flower:['etc','꽃집'],pet:['etc','반려동물'],funi:['etc','']};
function grp(c){var x=CAT[c]||['etc',''];return {g:G[x[0]],p:P[x[0]],sub:x[1]}}
function ic(c){var o=grp(c);return '<span class="ic" style="background:'+o.g[1]+'"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="'+o.g[2]+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+o.p+'</svg></span>'}
function metaOf(c,extra){var o=grp(c);return [o.g[0],o.sub,extra].filter(Boolean).join(' · ')}
function acts(x){var o=[];if(x.phone)o.push('<a href="tel:'+esc(String(x.phone).replace(/[^0-9]/g,''))+'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>전화하기</a>');if(x.addr)o.push('<a href="https://map.kakao.com/?q='+encodeURIComponent(x.addr)+'" target="_blank" rel="noopener"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>가게 위치 보기</a>');return o.length?'<div class="acts">'+o.join('')+'</div>':''}
var KIND={deal:['특가','k-deal'],new:['들어왔어요','k-new'],off:['쉬어요','k-off'],news:['소식','k-news']};
function ago(t){var m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));if(m<1)return'방금';if(m<60)return m+'분 전';var h=Math.round(m/60);if(h<24)return h+'시간 전';return Math.round(h/24)+'일 전'}
function until(t){var d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?'오늘까지':(d.getMonth()+1)+'/'+d.getDate()+'까지'}
var q=new URLSearchParams(location.search),code=(q.get('s')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);
var area=q.get('a')||ls('dn_area')||'',flt='all',NEWS=[],CPS=[];
var D=new Date();$('today').textContent=(D.getMonth()+1)+'월 '+D.getDate()+'일 '+'일월화수목금토'[D.getDay()]+'요일';
// 내 쿠폰
function mineGet(){try{return JSON.parse(ls('dn_mine')||'[]')}catch(e){return[]}}
function mineSet(a){ls('dn_mine',JSON.stringify(a.slice(0,30)));renderMine()}
function clap(store){$('clapBox').innerHTML='<div class="clap" role="status">'+CHICK.clap(70)+'<div><b>저장했어요! 짝짝짝</b><p>'+esc(store)+' 쿠폰을 \'내 쿠폰\'에 넣어 뒀어요</p></div></div>';clearTimeout(clap.h);clap.h=setTimeout(function(){$('clapBox').innerHTML=''},2600)}
function saveCp(c){var a=mineGet();if(a.some(function(x){return x.code===c.code}))return toast('이미 저장한 쿠폰이에요');a.unshift({code:c.code,store:c.store,mate:c.mate,offer:c.offer,terms:c.terms||'',area:c.area||'',at:Date.now()});mineSet(a);clap(c.store)}
function showCp(c){$('shS').textContent=c.store;$('shO').textContent=c.offer;$('shT').textContent=c.terms||'';$('show').classList.add('on')}
$('shX').onclick=function(){$('show').classList.remove('on')};
function cpCard(c,i,mine){return '<div class="card"><div class="ch">'+ic(c.mate)+'<div class="nm"><b>'+esc(c.store)+'</b><small>'+esc(metaOf(c.mate,c.area))+'</small></div><span class="bdg k-cp">쿠폰</span></div><p class="bd">'+esc(c.offer)+'</p>'+(c.terms?'<p class="lead" style="margin-top:4px">'+esc(c.terms)+'</p>':'')+(mine?'':acts(c))+(mine?'<button class="cpb" data-use="'+i+'">가게에서 보여 주기</button>':'<button class="cpb" data-cp="'+i+'">쿠폰 받기</button>')+'</div>'}
function renderMine(){var a=mineGet();$('mineN').textContent=a.length;$('mineN').classList.toggle('hidden',!a.length);
 $('mine').innerHTML=a.length?a.map(function(c,i){return cpCard(c,i,true)}).join(''):'<div class="empty">'+CHICK.sleep(120)+'<b>아직 저장한 쿠폰이 없어요</b><p>동네 소식에서 \'쿠폰 받기\'를 누르거나<br>가게 QR을 찍으면 여기에 모여요.</p></div>';
 $('mine').querySelectorAll('[data-use]').forEach(function(b){b.onclick=function(){showCp(a[+b.dataset.use])}})}
function view(v){$('v-feed').classList.toggle('hidden',v!=='feed');$('v-mine').classList.toggle('hidden',v!=='mine');$('shopBox').classList.toggle('hidden',v!=='feed'||!$('shopBox').innerHTML);window.scrollTo(0,0)}
$('mineBtn').onclick=function(){renderMine();view('mine')};$('backFeed').onclick=function(){view('feed')};
// 동네 고르기
$('areaBtn').onclick=function(){$('pick').classList.toggle('hidden');if(!$('pick').classList.contains('hidden')){$('areaIn').value=area;$('areaIn').focus();loadAreas()}};
function setArea(a){area=a.trim().slice(0,30);ls('dn_area',area||null);$('pick').classList.add('hidden');view('feed');load()}
$('areaGo').onclick=function(){setArea($('areaIn').value)};
$('areaIn').onkeydown=function(e){if(e.key==='Enter')setArea($('areaIn').value)};
function loadAreas(){rpc('town_areas').then(function(a){$('areaChips').innerHTML=(a||[]).map(function(x){return '<button data-a="'+esc(x.name)+'">'+esc(x.name)+'</button>'}).join('')+'<button data-a="">전체 보기</button>';$('areaChips').querySelectorAll('button').forEach(function(b){b.onclick=function(){setArea(b.dataset.a)}})}).catch(function(){})}
// 골라 보기
$('flt').querySelectorAll('button').forEach(function(b){b.onclick=function(){flt=b.dataset.f;$('flt').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
function card(n){var k=KIND[n.kind]||KIND.news;return '<article class="card"><div class="ch">'+ic(n.cat||n.mate)+'<div class="nm"><b>'+esc(n.store||'')+'</b><small>'+esc(metaOf(n.cat||n.mate,ago(n.at)))+'</small></div><span class="bdg '+k[1]+'">'+k[0]+'</span></div><p class="bd">'+esc(n.body)+'</p>'+acts(n)+'<div class="ft"><span>'+until(n.until)+'</span>'+(n.area&&!area?'<span>'+esc(n.area)+'</span>':'')+'</div></article>'}
function render(){
 var ns=NEWS.filter(function(n){return flt==='all'||flt===n.kind}),showCps=flt==='all'||flt==='cp';
 if(flt==='cp')ns=[];
 var latest=NEWS[0];
 $('jj').innerHTML=(flt==='all'&&latest)?'<button class="jj" id="jjBtn">'+CHICK.jjong(62)+'<span><b>쫑! '+(NEWS.length>1?'오늘 소식이 '+NEWS.length+'개 있어요':'새 소식이 왔어요')+'</b><small>'+esc(latest.store||'동네 가게')+'에서 '+ago(latest.at)+' 올렸어요</small></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14161F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>':'';
 var jb=$('jjBtn');if(jb)jb.onclick=function(){var f=document.querySelector('#feed .card');if(f)f.scrollIntoView({behavior:'smooth',block:'center'})};
 var none=!ns.length&&!(showCps&&CPS.length);
 $('feed').innerHTML=ns.map(card).join('')+(none?'<div class="empty">'+CHICK.sleep(140)+'<b>아직 조용해요</b><p>'+(flt==='all'?'오늘 '+(area?esc(area)+'에 ':'')+'올라온 소식이 없어요.<br>사장님들이 올리면 병아리가 깨워 줄게요.':'고른 소식이 아직 없어요.')+'</p>'+(area&&flt==='all'?'<a class="go" href="#" id="seeAll">전체 동네 소식 보기</a>':'')+'</div>':'');
 var sa=$('seeAll');if(sa)sa.onclick=function(e){e.preventDefault();setArea('')};
 $('cpHead').classList.toggle('hidden',!(showCps&&CPS.length&&ns.length));
 $('cps').innerHTML=showCps?CPS.map(function(c,i){return cpCard(c,i,false)}).join(''):'';
 $('cps').querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){saveCp(CPS[+b.dataset.cp])}});
}
function load(){
 $('areaTx').textContent=area||'동네 고르기';
 $('ttl').innerHTML=esc(area||'우리 동네')+' <mark>오늘</mark>';
 $('feed').innerHTML='<div class="empty"><p>불러오는 중…</p></div>';$('jj').innerHTML='';
 rpc('town_feed',{p_area:area,p_code:code}).then(function(d){
  if(d.shop&&!area&&d.area){area=d.area;$('areaTx').textContent=area;$('ttl').innerHTML=esc(area)+' <mark>오늘</mark>'}
  if(d.shop){var s=d.shop;
   $('shopBox').innerHTML=s.offer?'<div class="cpn"><small>'+esc(s.store)+(grp(s.mate).g[0]!=='가게'?' · '+grp(s.mate).g[0]:'')+'</small><h2>'+esc(s.offer)+'</h2>'+(s.terms?'<p>'+esc(s.terms)+'</p>':'')+'<hr><div class="act"><button id="cpSave">내 쿠폰에 저장</button><button class="l" id="cpShow">지금 보여 주기</button></div>'+acts(s)+'</div>':'<div class="cpn"><small>반가워요!</small><h2>'+esc(s.store)+'</h2><p>이 동네 가게들의 오늘 소식을 모아 봤어요.</p>'+acts(s)+'</div>';
   $('shopBox').classList.remove('hidden');
   if(s.offer){$('cpSave').onclick=function(){saveCp(s)};$('cpShow').onclick=function(){showCp(s)}}}
  NEWS=d.news||[];CPS=d.coupons||[];render();
 }).catch(function(){$('feed').innerHTML='<div class="empty">'+CHICK.sleep(120)+'<b>소식을 불러오지 못했어요</b><p>잠시 뒤 다시 열어 주세요.</p></div>'});
}
// 홈 화면 추가
var dp=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)$('homeTip').classList.add('hidden');
$('homeBtn').onclick=function(){if(dp){dp.prompt();dp=null;return}$('homeTx').textContent=ios?'사파리 아래 공유 버튼(네모에 화살표) → "홈 화면에 추가"':'크롬 오른쪽 위 점 세 개 → "홈 화면에 추가"'};
renderMine();if(!area&&!code)$('pick').classList.remove('hidden'),loadAreas();load();
})();
</script>
</body>
</html>
