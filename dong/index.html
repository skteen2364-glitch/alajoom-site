  var same=DONGS.some(function(d){return d.dong===pl.dong.replace(/제?[0-9]+동$/,'동')&&(d.gu||'')===(pl.gu||'')});
  if(DONGS.length>=2&&!same&&slot===null){btn.disabled=false;btn.textContent=t;var w=$('swap');w.classList.remove('hidden');
   w.innerHTML='<p class="rule" style="margin-top:12px"><b>지금 위치: '+esc(pl.dong)+'</b><br>동네는 2곳까지라 하나를 빼야 해요. 어느 동네를 뺄까요?</p>'+DONGS.map(function(d,i){return '<button class="gps" style="background:#fff;color:#14161F;border:1.5px solid #E9E2D0" data-sw="'+i+'">'+esc(d.dong)+' 빼고 '+esc(pl.dong)+' 넣기</button>'}).join('');
   w.querySelectorAll('[data-sw]').forEach(function(b){b.onclick=function(){save(pl,+b.dataset.sw,b)}});return}
  return save(pl,slot,btn)}).catch(function(e){btn.disabled=false;btn.textContent=t;
  toast(e==='denied'?'위치 권한을 허용해 주세요 (폰 설정 → 위치)':e==='far'?'위치가 정확하지 않아요. 밖에서 다시 눌러 주세요':e==='nodong'?'동네 이름을 못 찾았어요. 조금 움직여서 다시 눌러 주세요':'위치를 못 찾았어요. 다시 눌러 주세요')})
 function save(pl,sl,b){b.disabled=true;b.textContent='인증하는 중…';return rpc('dong_verify',{p_dev:dev(),p_dong:pl.dong,p_gu:pl.gu,p_si:pl.si,p_lat:C.latitude,p_lng:C.longitude,p_slot:sl}).then(function(r){
   DONGS=r.dongs||[];var k=r.dong;DONGS.forEach(function(d,i){if(d.dong===k)curD=i});ls('dn_cur',String(curD));toast('📍 '+k+' 인증했어요');$('pick').classList.add('hidden');load()}).catch(function(){b.disabled=false;b.textContent='다시 눌러 주세요';toast('바꾸기는 하루에 한 번이에요. 내일 다시 해 주세요')})}}
function head(){$('areaTx').textContent=area||'내 동네';$('ttl').innerHTML=esc(area||'우리 동네')+' <mark>오늘</mark>';
 $('dtabs').classList.toggle('hidden',DONGS.length<2);$('dtabs').innerHTML=DONGS.map(function(d,i){return '<button data-d="'+i+'" class="'+(i===curD?'on':'')+'">'+esc(d.dong)+'</button>'}).join('');
 $('dtabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){setCur(+b.dataset.d)}})}
function gateShow(){$('gate').innerHTML='<div class="gate">'+CHICK.sleep(120)+'<h2>우리 동네 사람만<br>볼 수 있어요</h2><p>지금 있는 동네를 폰 위치로 인증하면<br>그 동네 가게 소식과 3일 특가가 열려요.</p><button class="gps" id="gateBtn">📍 지금 있는 곳으로 동네 인증</button><ul><li>🏠 동네는 2곳까지만 (집 · 일터)</li><li>🔒 다른 동네 소식은 볼 수 없어요</li><li>⏳ 3일 특가는 그 동네 사람만 예약해요</li></ul></div>';$('gateBtn').onclick=function(){verify(null,$('gateBtn'))}}

function two(n){return (n<10?'0':'')+n}
function clockHTML(ms){ms=Math.max(0,ms);var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),x=Math.floor(ms%6e4/1e3);return '<span>'+d+'<small>일</small></span><i>:</i><span>'+two(h)+'<small>시간</small></span><i>:</i><span>'+two(m)+'<small>분</small></span><i>:</i><span>'+two(x)+'<small>초</small></span>'}
var rq={};
function ggCard(g,i){var left=g.qty?Math.max(0,g.qty-g.taken):null,pct=g.qty?Math.max(0,left/g.qty*100):100,soldout=g.qty&&left<=0;
 return '<div class="gcard"><div class="top">'+'<b>'+esc(g.store)+'</b><span>'+esc(grp(g.mate).g[0])+'</span><span class="no">'+esc(area)+' 특가 '+(i+1)+'</span></div><h3>'+esc(g.title)+'</h3><div class="pr"><b>'+esc(g.price)+'</b>'+(g.orig?'<s>'+esc(g.orig)+'</s>':'')+'</div>'+(g.note?'<p class="nt">'+esc(g.note)+'</p>':'')+
 '<div class="clock" data-end="'+esc(g.ends)+'">'+clockHTML(new Date(g.ends)-Date.now())+'</div>'+
 (g.qty?'<div class="left"><i style="width:'+pct+'%"></i></div><div class="lefttx"><span>'+(soldout?'다 예약됐어요':g.qty+'개 중 '+left+'개 남았어요')+'</span><span>'+g.people+'명 예약</span></div>':'<div class="lefttx"><span>'+g.people+'명 예약했어요</span></div>')+
 (g.my?'<div class="mycode"><small>예약했어요 · '+g.my.qty+'개 · 가게에서 이 번호를 말해 주세요</small><b>'+esc(g.my.code)+'</b><button data-cx="'+g.id+'">예약 취소</button></div>':soldout?'':'<div class="rsv"><div class="q"><button data-qm="'+g.id+'">−</button><b id="q'+g.id+'">'+(rq[g.id]||1)+'</b><button data-qp="'+g.id+'">＋</button></div><button class="go3" data-rv="'+g.id+'">예약하기</button></div>')+acts(g)+'</div>'}
function renderGG(){var b=$('gg');if(!DONGS.length){b.innerHTML='';return}var gs=GG.filter(function(g){return g.d===area});
 var h='<h2>⏳ '+esc(area)+' 3일 특가</h2><p class="sub">'+esc(area)+' 사람만 예약해요 · 딱 2가지 · 3일 뒤 끝나요 · 돈은 가게에서 내요</p>';
 h+=gs.map(ggCard).join('');for(var k=gs.length;k<2;k++)h+='<div class="gempty">빈자리 '+(k+1)+' · '+esc(area)+' 사장님이 올리면 여기에 떠요</div>';
 b.innerHTML=h;
 b.querySelectorAll('[data-qm],[data-qp]').forEach(function(x){x.onclick=function(){var id=x.dataset.qm||x.dataset.qp;rq[id]=Math.max(1,Math.min(5,(rq[id]||1)+(x.dataset.qm?-1:1)));$('q'+id).textContent=rq[id]}});
 b.querySelectorAll('[data-rv]').forEach(function(x){x.onclick=function(){var id=+x.dataset.rv;x.disabled=true;rpc('gonggu_reserve',{p_id:id,p_dev:dev(),p_qty:rq[id]||1}).then(function(r){GG.forEach(function(g){if(g.id===id){g.my=r;g.people+=1;g.taken+=r.qty}});renderGG();clap('',"예약했어요! 짝짝짝",'예약 번호 '+esc(r.code)+' · 가게에서 말해 주세요')}).catch(function(e){x.disabled=false;toast('다 예약됐거나 끝난 특가예요');load()})}});
 b.querySelectorAll('[data-cx]').forEach(function(x){x.onclick=function(){rpc('gonggu_cancel',{p_id:+x.dataset.cx,p_dev:dev()}).then(function(){toast('예약을 취소했어요');load()})}});
 wire(b)}
setInterval(function(){document.querySelectorAll('.clock[data-end]').forEach(function(c){var ms=new Date(c.dataset.end)-Date.now();c.innerHTML=clockHTML(ms);if(ms<=0)c.removeAttribute('data-end')})},1000);
// 골라 보기
$('flt').querySelectorAll('button').forEach(function(b){b.onclick=function(){flt=b.dataset.f;$('flt').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
function card(n){var k=n.flash?['⚡ 번개','k-flash']:(KIND[n.kind]||KIND.news);return '<article class="card" id="n'+n.id+'"><div class="ch">'+ic(n.cat||n.mate)+'<div class="nm"><b>'+esc(n.store||'')+'</b><small>'+esc(metaOf(n.cat||n.mate,ago(n.at)))+'</small></div><span class="bdg '+k[1]+'">'+k[0]+'</span></div><p class="bd">'+esc(n.body)+'</p>'+(n.flash?'<div class="flash" data-from="'+esc(n.at)+'" data-until="'+esc(n.until)+'"><i></i><b></b></div>':'')+acts(n)+'<div class="ft"><span>'+(n.flash?'':until(n.until))+(n.going>0?' <span class="going" data-gn="'+n.id+'">· '+n.going+'명 가는 중</span>':'')+(n.area&&!area?' · '+esc(n.area):'')+'</span>'+favBtn(n)+'</div></article>'}
function render(){
 var fc=favCodes(),ND=NEWS.filter(function(n){return n.d===area}),ns=ND.filter(function(n){return flt==='all'||flt===n.kind||(flt==='deal'&&n.flash)||(flt==='fav'&&fc.indexOf(n.code)>-1)}),showCps=flt==='all'||flt==='cp'||flt==='fav',CD=CPS.filter(function(c){return c.d===area}),cpl=flt==='fav'?CD.filter(function(c){return fc.indexOf(c.code)>-1}):CD;
 if(flt==='cp')ns=[];
 var latest=ND[0];
 $('jj').innerHTML=(flt==='all'&&latest)?'<button class="jj" id="jjBtn">'+CHICK.jjong(62)+'<span><b>쫑! '+(ND.length>1?'오늘 소식이 '+ND.length+'개 있어요':'새 소식이 왔어요')+'</b><small>'+esc(latest.store||'동네 가게')+'에서 '+ago(latest.at)+' 올렸어요</small></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14161F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>':'';
 var jb=$('jjBtn');if(jb)jb.onclick=function(){var f=document.querySelector('#feed .card');if(f)f.scrollIntoView({behavior:'smooth',block:'center'})};
 var none=!ns.length&&!(showCps&&cpl.length);
 $('feed').innerHTML=ns.map(card).join('')+(none?'<div class="empty">'+CHICK.sleep(140)+'<b>아직 조용해요</b><p>'+(flt==='fav'?(fc.length?'단골 가게의 오늘 소식이 아직 없어요.<br>올라오면 바로 여기에 보여요.':'아직 단골 가게가 없어요.<br>소식 아래 \'♡ 단골\'을 누르면 그 가게 소식만 모아 봐요.'):flt==='all'?'오늘 '+(area?esc(area)+'에 ':'')+'올라온 소식이 없어요.<br>사장님들이 올리면 병아리가 깨워 줄게요.':'고른 소식이 아직 없어요.')+'</p>'+'</div>':'');
 $('cpHead').classList.toggle('hidden',!(showCps&&cpl.length&&ns.length));
 $('cps').innerHTML=showCps?cpl.map(function(c,i){return cpCard(c,i,false)}).join(''):'';
 $('cps').querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){saveCp(cpl[+b.dataset.cp])}});
 wire(document.getElementById('v-feed'));tick();
}
function SHOPH(s){return s.offer?'<div class="cpn"><small>'+esc(s.store)+(grp(s.mate).g[0]!=='가게'?' · '+grp(s.mate).g[0]:'')+'</small><h2>'+esc(s.offer)+'</h2>'+(s.terms?'<p>'+esc(s.terms)+'</p>':'')+'<hr><div class="act"><button id="cpSave">내 쿠폰에 저장</button><button class="l" id="cpShow">지금 보여 주기</button></div>'+acts(s)+favBig(s)+'</div>':'<div class="cpn"><small>반가워요!</small><h2>'+esc(s.store)+'</h2><p>이 가게 소식과 쿠폰을 바로 받아 보세요.</p>'+acts(s)+favBig(s)+'</div>'}
function load(){
 $('feed').innerHTML='<div class="empty"><p>불러오는 중…</p></div>';$('jj').innerHTML='';
 rpc('town_feed2',{p_dev:dev(),p_code:code}).then(function(d){
  if(d.shop){var s=d.shop;
   $('shopBox').innerHTML=SHOPH(s);$('shopBox').classList.remove('hidden');
   if(s.offer){$('cpSave').onclick=function(){saveCp(s)};$('cpShow').onclick=function(){showCp(s)}}wire($('shopBox'))}
  DONGS=d.dongs||[];if(curD>=DONGS.length)curD=0;area=DONGS[curD]?DONGS[curD].dong:'';
  var none=!DONGS.length;$('gate').classList.toggle('hidden',!none);$('v-feed').classList.toggle('hidden',none);$('homeTip').classList.toggle('hidden',none||standalone);
  if(none){gateShow();$('areaTx').textContent='동네 인증';return}
  NEWS=d.news||[];CPS=d.coupons||[];GG=d.gonggu||[];head();renderGG();render();ntfBox();
  var nid=q.get('n');if(nid){var el=$('n'+nid.replace(/[^0-9]/g,''));if(el){el.classList.add('hl');setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'center'})},300)}}
 }).catch(function(){$('feed').innerHTML='<div class="empty">'+CHICK.sleep(120)+'<b>소식을 불러오지 못했어요</b><p>잠시 뒤 다시 열어 주세요.</p></div>'});
}

if(canPush&&ls('dn_push')==='1')navigator.serviceWorker.register('/dong/sw.js').catch(function(){});
