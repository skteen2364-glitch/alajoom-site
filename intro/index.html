<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta property="og:title" content="알아줌 소개 — 말로 듣기"><meta property="og:description" content="소상공인 경영 비서 알아줌, 2분 소개"><meta property="og:image" content="https://alajoom.com/intro/s01.jpg"><title>알아줌 소개 — 말로 듣기</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#14161F;color:#FBF7EE;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#stage{position:relative;width:min(100%,calc((100vh - 230px)*16/9));aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 20px 50px #0008}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
#stage img.on{opacity:1}
#cap{width:min(100%,960px);min-height:72px;font-size:clamp(16px,2.2vw,21px);line-height:1.55;font-weight:600;text-align:center;color:#E6E8EF}
#bar{display:flex;align-items:center;gap:10px}
button{font:inherit;cursor:pointer;border:0}
.nb{width:46px;height:46px;border-radius:50%;background:#262A3A;color:#FBF7EE;font-size:20px;font-weight:900}
#pp{min-width:130px;height:46px;border-radius:999px;background:#FFD84D;color:#14161F;font-weight:900;font-size:17px;padding:0 20px}
#dots{display:flex;gap:6px;margin:0 6px}#dots i{width:8px;height:8px;border-radius:50%;background:#3A3F52;cursor:pointer}#dots i.on{background:#FFD84D;width:22px;border-radius:6px}
#start{position:fixed;inset:0;background:#14161Fcc;backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;text-align:center;padding:24px}
#start b{font-size:clamp(24px,4vw,40px);font-weight:900}
#start p{color:#C9CDD8;font-size:16px}
#go{height:64px;padding:0 34px;border-radius:999px;background:#FFD84D;color:#14161F;font-size:21px;font-weight:900}
#start small{color:#8A8F9C;font-size:13px}
@media (max-width:600px){#dots{display:none}#cnt{display:inline}}#cnt{display:none;font-weight:800;color:#C9CDD8;min-width:52px;text-align:center}
#nov{display:none;font-size:13px;color:#FFD84D}
</style></head><body>
<div id="app">
 <div id="stage"><img src="s01.jpg" alt="1장" class=on><img src="s02.jpg" alt="2장"><img src="s03.jpg" alt="3장"><img src="s04.jpg" alt="4장"><img src="s05.jpg" alt="5장"><img src="s06.jpg" alt="6장"><img src="s07.jpg" alt="7장"><img src="s08.jpg" alt="8장"><img src="s09.jpg" alt="9장"><img src="s10.jpg" alt="10장"><img src="s11.jpg" alt="11장"><img src="s12.jpg" alt="12장"></div>
 <p id="cap"></p>
 <div id="bar"><button class="nb" id="pv" aria-label="이전">‹</button><button id="pp">❚❚ 멈춤</button><div id="dots"></div><span id="cnt">1 / 12</span><button class="nb" id="nx" aria-label="다음">›</button></div>
 <p id="nov">이 기기에서는 한국어 음성이 없어 자막으로 넘겨 드려요.</p>
</div>
<div id="start"><b>알아줌 소개, 말로 들어 보세요</b><p>약 2분 · 12장 · 소리를 켜 주세요</p><button id="go">▶ 소개 듣기</button><small>소리 없이 보시려면 아래 버튼으로 넘겨도 돼요</small></div>
<script>
const S=["안녕하세요. 혼자 가게를 꾸리는 사장님을 위한 소상공인 경영 비서, 알아줌을 소개합니다.", "1인 사장님은 장사하면서 홍보 글, 리뷰 답글, 장부, 세금까지 모두 혼자 챙기십니다. 퇴근 후에 홍보 글을 붙잡고 있는 날도 많으시죠.", "알아줌만의 무기는 이것입니다. 매주 인스타그램과 네이버 블로그의 인기 글을 업종별로 모아 분석합니다.", "업종 여덟 곳을 매주 월요일 새로 분석하고, 분석 내용과 참고 자료는 사장님이 직접 확인하실 수 있습니다. 요즘 잘 되는 글의 첫 줄과 구성, 해시태그를 우리 가게 글에 그대로 반영합니다.", "사장님은 한 줄만 말씀하시면 됩니다. 인스타그램, 블로그, 카톡 글이 사장님 말투로 한 번에 나옵니다.", "알아줌은 홍보에서 끝나지 않습니다. 글 다듬기, 고객과 매출 장부, 세금 미리보기까지 챙기는 경영 비서입니다.", "거래처 메일이나 휴무 안내처럼 쓰기 번거로운 글도, 말로 하시면 깔끔하게 다듬어 드립니다.", "장부에 한 달 매출과 경비를 넣으면, 올해 부가세와 종합소득세가 대략 얼마인지, 한 달에 얼마씩 모아 두면 되는지 미리 보여 드립니다.", "전통시장 어르신 사장님을 위한 큰 글씨 화면, 알아줌 시장도 있습니다. 고등어 세 마리 만 원, 이렇게 말하면 가게 앞에 붙일 특가 종이와 카톡 글이 나오고, 삼십만 원 팔았어, 하면 장부에 바로 적힙니다.", "그리고 사장님 확인 없이는 아무것도 나가지 않습니다. 계정 비밀번호도 받지 않아서 안심하고 쓰실 수 있습니다.", "시작은 간단합니다. 알아줌 닷컴에서 업종을 고르고, 카카오로 3초면 무료로 시작합니다.", "회원 사장님들께 알아줌을 소개해 주시면, 현장의 사장님들께 든든한 경영 비서가 되겠습니다. 감사합니다."];
const imgs=[...document.querySelectorAll('#stage img')],cap=document.getElementById('cap'),dots=document.getElementById('dots'),pp=document.getElementById('pp');
S.forEach((_,i)=>{const d=document.createElement('i');d.onclick=()=>go(i);dots.appendChild(d)});
let cur=0,playing=false,timer=null,voice=null,tok=0;const syn=window.speechSynthesis;
function pickVoice(){if(!syn)return null;const v=syn.getVoices().filter(v=>/^ko/i.test(v.lang));const pref=['SunHi','Google 한국','Yuna','유나','Heami','InJoon','Siri'];for(const p of pref){const f=v.find(x=>x.name.includes(p));if(f)return f}return v[0]||null}
if(syn){voice=pickVoice();syn.onvoiceschanged=()=>{voice=pickVoice()}}
function show(i){cur=i;imgs.forEach((m,k)=>m.classList.toggle('on',k==i));[...dots.children].forEach((d,k)=>d.classList.toggle('on',k==i));cap.textContent=S[i];document.getElementById('cnt').textContent=(i+1)+' / '+S.length}
function stop(){tok++;clearTimeout(timer);try{syn&&syn.cancel()}catch(e){}}
function next(){if(cur<S.length-1){speak(cur+1)}else{playing=false;pp.textContent='↺ 처음부터'}}
function speak(i){stop();show(i);if(!playing)return;const my=tok;
 const fb=()=>{timer=setTimeout(()=>{if(my==tok)next()},Math.max(3500,S[i].length*140))};
 if(!syn||!voice){document.getElementById('nov').style.display='block';fb();return}
 const u=new SpeechSynthesisUtterance(S[i]);u.lang='ko-KR';u.voice=voice;u.rate=1.0;u.pitch=1.0;
 let ended=false;u.onend=()=>{if(ended||my!=tok)return;ended=true;timer=setTimeout(()=>{if(my==tok)next()},700)};
 u.onerror=()=>{if(ended||my!=tok)return;ended=true;fb()};
 syn.speak(u);
 // 안전장치: 음성이 멈춰도 넘어가게
 setTimeout(()=>{if(!ended&&my==tok&&!syn.speaking){ended=true;fb()}},2500);
}
function go(i){speak(i)}
function play(){playing=true;pp.textContent='❚❚ 멈춤';if(cur>=S.length-1&&pp.dataset.done){cur=0}speak(cur)}
function pause(){playing=false;stop();pp.textContent='▶ 이어 듣기'}
pp.onclick=()=>{if(pp.textContent.includes('처음')){cur=0;play()}else if(playing)pause();else play()};
document.getElementById('pv').onclick=()=>go(Math.max(0,cur-1));
document.getElementById('nx').onclick=()=>go(Math.min(S.length-1,cur+1));
document.getElementById('go').onclick=()=>{document.getElementById('start').remove();voice=pickVoice();play()};
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='ArrowDown')go(Math.min(S.length-1,cur+1));if(e.key=='ArrowLeft'||e.key=='ArrowUp')go(Math.max(0,cur-1));if(e.key==' '){e.preventDefault();pp.click()}});
show(0);
</script></body></html>
