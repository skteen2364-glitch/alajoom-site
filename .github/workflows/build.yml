name: build-aab
on: { push: { branches: [android-src] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: gradle :app:bundleRelease :app:assembleRelease --no-daemon
      - run: |
          mkdir -p /tmp/out && cp app/build/outputs/bundle/release/app-release.aab /tmp/out/alajoom-unsigned.aab
          cp app/build/outputs/apk/release/*.apk /tmp/out/alajoom-unsigned.apk
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan android-out && git rm -rqf . && cp /tmp/out/* . && git add *.aab *.apk
          git commit -qm "build $GITHUB_SHA" && git push -f origin android-out
