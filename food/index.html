<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸드메이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 알아줌 공통 바탕(아이보리+노랑) + 푸드메이트 포인트 색(주황). --blue 이름은 '메이트 포인트 색'으로 씀 */
  --blue:#D9480F; --blue-deep:#A8380B; --blue-tint:#FDEBDD;
  --yellow:#FFD43B; --ivory:#FBF7EE; --ink:#14161F; --muted:#5B6070; --line:#E8E1D0;
  --ok:#12A150; --warn:#C2410C; --warn-tint:#FFF1E8;
  --font:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--font);line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:0;z-index:5;background:var(--ivory);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px 12px 12px 4px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted)}
.quota{font-size:12px;font-weight:700;color:var(--blue-deep);background:var(--blue-tint);padding:5px 10px;border-radius:999px;white-space:nowrap}
.studio{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.studio .av{width:40px;height:40px;border-radius:50%;background:var(--blue-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--blue)}
.studio>div:not(.av){flex:1;min-width:0}
.studio b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.studio span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:8px 4px;white-space:nowrap}
h1{margin:6px 0 0;font-size:22px;font-weight:900;letter-spacing:-.6px;line-height:1.35;text-wrap:balance}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool.wide{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0;gap:12px;border-color:var(--blue);background:#EEF2FA}
.tool.wide[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue) inset}
.setc{flex:none;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer}
.setc[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--yellow)}
.tool.hero{grid-column:1 / -1;flex-direction:row;align-items:center;min-height:0;gap:14px;background:var(--ink);color:#fff;border-color:var(--ink)}
.tool.hero .ic{background:var(--yellow);color:var(--ink);width:44px;height:44px;flex-shrink:0}
.tool.hero span{color:#C9CFDB}
.tool.hero[aria-pressed="true"]{box-shadow:0 0 0 3px var(--yellow) inset}
.alt-pick{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.alt-pick input{font-size:14px;max-width:100%}
.file-cover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #CFC5AE;border-radius:16px;padding:26px 12px;background:var(--ivory);text-align:center;cursor:pointer}
.drop b{font-size:15px}.drop span{font-size:12.5px;color:var(--muted)}
.ph-wrap{position:relative}
.ph-wrap img{width:100%;display:block;border-radius:14px;border:1px solid var(--line);background:#eee}
.hold{position:absolute;right:10px;top:10px;border:0;border-radius:999px;background:rgba(20,22,31,.75);color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;touch-action:none;-webkit-user-select:none;user-select:none}
.tag{display:inline-block;margin-top:8px;border-radius:999px;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:900;padding:5px 10px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.sl{display:grid;grid-template-columns:56px 1fr 34px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.sl input{width:100%;accent-color:var(--blue)}
.sl output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out-c{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;position:relative}
.out-c[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.out-c b{font-size:14px}.out-c span{font-size:12px;color:var(--muted);line-height:1.4}
.out-c em{align-self:flex-start;margin-bottom:2px;font-style:normal;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:999px;background:#EAF6EF;color:#0B6B3A}
.out-c em.soon{background:#F1EEE6;color:#7A7365}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--yellow);font-size:11px;font-weight:900;margin-right:6px}
.soon-box{border:1px dashed #CFC5AE;border-radius:14px;background:var(--ivory);padding:16px;display:flex;flex-direction:column;gap:8px}
.soon-box b{font-size:15px}.soon-box p{margin:0;font-size:13px;color:var(--muted)}
.ex{display:flex;flex-wrap:wrap;gap:6px}.ex span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.tool{text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:116px;transition:transform .15s ease,border-color .15s ease}
.tool:active{transform:scale(.98)}
.tool[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.tool .ic{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--yellow);display:flex;align-items:center;justify-content:center}
.tool b{font-size:15px;line-height:1.3}
.tool span{font-size:12px;color:var(--muted);line-height:1.4;display:block}
.tool.hero b{display:block;font-size:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.4px}
.step{display:flex;flex-direction:column;gap:8px}
.step>label,.step>p{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:700;color:#3A3F4C}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;background:#fff}
textarea{min-height:88px;resize:vertical}
.go{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:16px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.go:disabled{opacity:.55}
.result{display:flex;flex-direction:column;gap:10px}
.out{white-space:pre-wrap;background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;line-height:1.7;min-height:80px}
.out.thinking{color:var(--muted)}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;border-radius:12px;padding:10px 12px;background:#EAF6EF;color:#0B6B3A;font-weight:700}
.check.bad{background:var(--warn-tint);color:var(--warn)}
.check ul{margin:4px 0 0;padding-left:18px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sub{flex:1 1 0;min-width:96px;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:44px;font-size:14px;font-weight:700;padding:0 10px}
.sub.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s ease;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.card-prev{width:100%;border-radius:16px;border:1px solid var(--line);display:block;background:#eee}
.themes{display:flex;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue)}
.fields{display:grid;gap:8px}
dialog{border:0;border-radius:22px;padding:0;width:min(440px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(20,22,31,.45)}
.dlg{padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px;font-weight:900}
.dlg label{font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.mode{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
.hidden{display:none !important}
/* 탭 · 내 메뉴 · 장부 · 보관함 */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px}
.tab{border:0;background:none;border-radius:12px;min-height:44px;font-size:14px;font-weight:700;color:var(--muted);padding:0 4px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.view{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg .chip{white-space:nowrap}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec{margin:4px 0 -4px;font-size:13px;font-weight:900;color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.3px;overflow-wrap:anywhere}
.stat.plus b{color:var(--blue-deep)}.stat.minus b{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:flex;gap:10px;align-items:flex-start}
.item>div:first-child{flex:1;min-width:0}
.item b{display:block;font-size:15px;line-height:1.4}
.item span.m{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.amt{font-weight:900;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;vertical-align:1px;font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px;margin-right:5px;background:var(--blue-tint);color:var(--blue-deep)}
.badge.neg{background:var(--warn-tint);color:var(--warn)}.badge.wait{background:#FFF6CC;color:#7A5C00}.badge.done{background:#EAF6EF;color:#0B6B3A}
.mini{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12.5px;font-weight:700;padding:6px 10px;min-height:36px;white-space:nowrap;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:5px;min-width:0}
.formbox{border:2px solid var(--blue);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.formbox h3{margin:0;font-size:16px;font-weight:900}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:18px 10px;border:1px dashed #CFC5AE;border-radius:14px;background:var(--ivory)}
.qrow{display:grid;grid-template-columns:1fr 54px 84px 36px;gap:6px;align-items:center}
.qrow input{padding:9px 8px;font-size:14px}
.qrow .x{border:0;background:none;font-size:20px;color:var(--muted);min-height:40px}
.qsum{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px}
.qsum b{font-size:22px;font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums}
.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.lead{background:var(--blue-tint);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--blue-deep);font-weight:700}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  body.printing .app,body.printing dialog,body.printing .toast{display:none !important}
  body.printing{background:#fff}
  body.printing #printArea{display:block}
  #printArea img{width:100%;display:block}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
<link rel="manifest" href="/food/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-food.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="푸드메이트"><meta name="theme-color" content="#FFF8E7"><script src="/assets/ai-bridge.js?v=11121459"></script><script src="/assets/mate-install.js?v=11120006" defer></script>

<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">알</div><div><b>푸드메이트</b><small>알아줌 · 음식점 사장님 AI 직원</small></div></div>
    <span class="quota" id="quota">오늘 10회 남음</span>
  </header>

  <section class="studio" aria-label="가게 정보">
    <div class="av" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1 1-2 1-3M12 7c0-1 1-2 1-3M16 7c0-1 1-2 1-3"/></svg></div>
    <div><b id="stName"></b><span id="stMeta"></span></div>
    <button class="link-btn" id="editStudio" type="button">정보 수정</button>
  </section>

  <nav class="tabs" role="tablist" aria-label="푸드메이트 메뉴">
    <button class="tab" type="button" role="tab" data-view="home" aria-selected="true">오늘</button>
    <button class="tab" type="button" role="tab" data-view="promo" aria-selected="false">홍보</button>
    <button class="tab" type="button" role="tab" data-view="menu" aria-selected="false">내 메뉴</button>
    <button class="tab" type="button" role="tab" data-view="ledger" aria-selected="false">장부</button>
    <button class="tab" type="button" role="tab" data-view="box" aria-selected="false">작업실</button>
  </nav>

  <div class="view" id="v-home"></div>
  <div class="view hidden" id="v-promo">
  <h1>사장님, 오늘은 뭘 만들까요?</h1>
  <button type="button" id="voiceBtn" style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px;margin:-4px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:18px;background:#fff;font:inherit;text-align:left;cursor:pointer">
    <span aria-hidden="true" style="flex:none;width:40px;height:40px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14161F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <span style="flex:1;min-width:0"><b style="display:block;font-size:15px">말로 시키기</b><span style="font-size:12.5px;color:var(--muted)">"단골들한테 신메뉴 카톡으로 알려줘" · "점심 특선 인스타 글 써줘"</span></span>
  </button>


  <div class="tools" role="group" aria-label="만들 것 고르기">
    <button class="tool hero" type="button" data-tool="photo" aria-pressed="true"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><div><b>사진 올리고 홍보하기</b><span>음식 사진을 맛있게 보정하고, 그 사진으로 홍보글까지</span></div></button>
    <button class="tool wide" type="button" data-tool="set" aria-pressed="false"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg></span><span style="flex:1;min-width:0"><b style="display:block">AI 직원 세트</b><span>인스타·블로그·릴스·문자를 한 번에 · 전략→작성→검토</span></span></button>
    <button class="tool" type="button" data-tool="post" aria-pressed="false"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span><b>홍보글</b><span>인스타·블로그·당근·플레이스</span></button>
    <button class="tool" type="button" data-tool="card" aria-pressed="false"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg></span><b>안내 카드</b><span>신메뉴·오늘의 메뉴·휴무</span></button>
    <button class="tool" type="button" data-tool="sms" aria-pressed="false"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span><b>손님 문자</b><span>예약 확인·재방문 쿠폰</span></button>

  /* ---------- 카드 그리기 ---------- */
  var THEMES = [

  function analyse(){
    var c = document.createElement('canvas'), w = 256, h = Math.max(1, Math.round(256 * ph.img.naturalHeight / ph.img.naturalWidth));
    c.width = w; c.height = h; var x = c.getContext('2d'); x.drawImage(ph.img, 0, 0, w, h);
    var d = x.getImageData(0, 0, w, h).data, H = [new Array(256).fill(0), new Array(256).fill(0), new Array(256).fill(0)], n = d.length / 4;
    for (var i = 0; i < d.length; i += 4){ H[0][d[i]]++; H[1][d[i+1]]++; H[2][d[i+2]]++; }
    function pct(hh, p, fromTop){ var acc = 0, t = n * p; if (!fromTop){ for (var v = 0; v < 256; v++){ acc += hh[v]; if (acc >= t) return v; } return 0; } for (v = 255; v >= 0; v--){ acc += hh[v]; if (acc >= t) return v; } return 255; }

    var Lo = Math.min(lo[0], lo[1], lo[2]), Hi = Math.max(hi[0], hi[1], hi[2]);
    for (ch = 0; ch < 3; ch++){ lo[ch] = lo[ch] * .7 + Lo * .3; hi[ch] = hi[ch] * .7 + Hi * .3; }
    // 늘인 뒤 평균 밝기 → 감마로 중간톤 맞추기
    var sum = 0;
    for (i = 0; i < d.length; i += 4){
      var r = (d[i] - lo[0]) / (hi[0] - lo[0]), g = (d[i+1] - lo[1]) / (hi[1] - lo[1]), bb = (d[i+2] - lo[2]) / (hi[2] - lo[2]);

  }
  function applyPreset(p){
    ph.preset = p; var W = CFG.photo.warm;

    var A0 = ph.auto || {satNeed:1, conNeed:1}, sn = .35 + .65 * A0.satNeed, cn = .3 + .7 * A0.conNeed;

  function boxBlur(src, w, h, r){

  function saveQ(silent){

    if (!editQ.customer){ toast('손님·단체 이름을 적어주세요'); $('#qCus').focus(); return false; }
    editQ.items = editQ.items.filter(function(it){ return it.name; });
    if (!editQ.id){ editQ.id = uid(); DB.quotes.push(editQ); }
    else DB.quotes = DB.quotes.map(function(q){ return q.id === editQ.id ? editQ : q; });
    editQ = JSON.parse(JSON.stringify(editQ));
    save('quotes'); if (!silent) toast('저장했어요'); return true;
  }
  function quoteText(q){
    var t = '[' + q.customer + '님] ' + studio.name + ' 견적 안내드려요.\n· 일시: ' + (q.date ? md(q.date) : '[날짜]') + ' ' + (q.time || '') + '\n· 인원: ' + (q.people || '[인원]') + '명' + (q.place ? '\n· 장소: ' + q.place : '') + '\n';
    q.items.forEach(function(it){ if (it.name) t += '· ' + it.name + ' ' + it.qty + '개 × ' + won(it.price) + ' = ' + won(it.qty * it.price) + '\n'; });
    if (num(q.discount)) t += '· 할인: -' + won(q.discount) + '\n';
    t += '▶ 합계 ' + won(qTotal(q)) + (q.memo ? '\n' + q.memo : '') + '\n문의: ' + studio.contact;
    return t;
  }
  function drawQuote(q){
    var W = 1240, H = 1754, M = 100, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.textBaseline = 'alphabetic';
    x.fillStyle = '#FFD43B'; x.fillRect(0, 0, W, 18);
    x.fillStyle = '#14161F'; x.textAlign = 'center'; x.font = '900 84px ' + FONT; x.fillText('견 적 서', W / 2, 170);
    x.font = '500 26px ' + FONT; x.fillStyle = '#5B6070'; x.fillText('발행일 ' + ymd(), W / 2, 220); x.textAlign = 'left';
    // 받는 분 / 보내는 곳
    var y = 280, bw = (W - M * 2 - 30) / 2;
    [[M, '받는 분', [q.customer + ' 귀하', '일시 · ' + (q.date || '[날짜]') + ' ' + (q.time || ''), '인원 · ' + (q.people || '[인원]') + '명', q.place ? '장소 · ' + q.place : '', q.phone ? '연락처 · ' + q.phone : '']],
     [M + bw + 30, '보내는 곳', [studio.name, studio.area, studio.contact]]].forEach(function(b){
      x.fillStyle = '#FBF7EE'; roundRect(x, b[0], y, bw, 300, 20); x.fill();
      x.fillStyle = '#D9480F'; x.font = '900 26px ' + FONT; x.fillText(b[1], b[0] + 30, y + 52);
      var yy = y + 52; b[2].filter(Boolean).forEach(function(l, i){ yy += i === 0 ? 54 : 42; x.fillStyle = '#14161F'; fitFont(x, l, i === 0 ? '900' : '500', i === 0 ? 36 : 26, bw - 60, 14); x.fillText(l, b[0] + 30, yy); });
    });
    // 표
    y += 350; var cols = [M + 24, W - M - 470, W - M - 260, W - M - 24];
    x.fillStyle = '#14161F'; x.fillRect(M, y, W - M * 2, 70);
    x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.fillText('품목', cols[0], y + 46); x.textAlign = 'right'; x.fillText('수량', cols[1], y + 46); x.fillText('단가', cols[2], y + 46); x.fillText('금액', cols[3], y + 46); x.textAlign = 'left';
    y += 70; var items = q.items.filter(function(it){ return it.name; }).slice(0, 12), sub = 0;
    if (!items.length) items = [{name:'[품목]', qty:0, price:0}];
    items.forEach(function(it, i){
      var amt = num(it.qty) * num(it.price); sub += amt;
      if (i % 2) { x.fillStyle = '#FBF7EE'; x.fillRect(M, y, W - M * 2, 72); }
      x.fillStyle = '#14161F'; fitFont(x, it.name, '500', 30, cols[1] - cols[0] - 120, 14); x.fillText(it.name, cols[0], y + 47);
      x.font = '500 30px ' + FONT; x.textAlign = 'right'; x.fillText(String(it.qty || ''), cols[1], y + 47); x.fillText(it.price ? won(it.price) : '', cols[2], y + 47); x.fillText(amt ? won(amt) : '', cols[3], y + 47); x.textAlign = 'left';
      y += 72;
    });
    x.strokeStyle = '#14161F'; x.lineWidth = 3; x.beginPath(); x.moveTo(M, y); x.lineTo(W - M, y); x.stroke();
    y += 60; x.font = '500 30px ' + FONT; x.fillStyle = '#5B6070'; x.textAlign = 'right';
    x.fillText('소계  ' + won(sub), W - M - 24, y);
    if (num(q.discount)){ y += 48; x.fillStyle = '#C2410C'; x.fillText('할인  -' + won(q.discount), W - M - 24, y); }
    y += 40; x.fillStyle = '#14161F'; roundRect(x, W - M - 560, y, 560, 110, 22); x.fill();
    x.fillStyle = '#FFD43B'; x.font = '900 52px ' + FONT; x.fillText(won(qTotal(q)), W - M - 34, y + 74);
    x.textAlign = 'left'; x.fillStyle = '#fff'; x.font = '700 28px ' + FONT; x.fillText('합계 (원)', W - M - 530, y + 66);
    y += 170;
    if (q.memo){ x.fillStyle = '#FBF7EE'; roundRect(x, M, y, W - M * 2, 110, 20); x.fill(); x.fillStyle = '#14161F'; fitFont(x, '메모 · ' + q.memo, '500', 28, W - M * 2 - 60, 14); x.fillText('메모 · ' + q.memo, M + 30, y + 66); y += 140; }
    x.textAlign = 'center'; x.fillStyle = '#14161F'; x.font = '700 32px ' + FONT; x.fillText('위와 같이 견적합니다.', W / 2, H - 200);
    x.font = '900 40px ' + FONT; x.fillText(studio.name, W / 2, H - 140);
    x.font = '500 24px ' + FONT; x.fillStyle = '#5B6070'; x.fillText('견적 금액은 협의에 따라 바뀔 수 있어요 · 알아줌 푸드메이트로 만들었어요', W / 2, H - 80);
    x.textAlign = 'left';
    return cv;
  }

  /* ---------- 보관함 ---------- */
  function renderBox(){
    var h = '<section class="panel"><div class="hrow"><h2>글 보관함 <small style="font-size:13px;color:var(--muted)">' + DB.box.length + '개</small></h2></div><p class="note">홍보 탭에서 만든 글 아래 \'보관함 저장\'을 누르면 여기에 모여요. 말투는 위 \'정보 수정\'에서 바꿀 수 있어요.</p>';
    h += DB.box.length ? '<div class="list">' + DB.box.map(function(b){ return '<div class="item" style="flex-direction:column;align-items:stretch"><div><b><span class="badge">' + esc(b.kind) + '</span>' + esc(b.topic || '') + (b.ch ? ' · ' + esc(b.ch) : '') + '</b><span class="m">' + esc(b.date) + '</span></div><div class="clip" style="font-size:14px">' + esc(b.text) + '</div><div style="display:flex;gap:6px"><button type="button" class="mini on" data-x="box-copy" data-id="' + b.id + '">복사</button><button type="button" class="mini" data-x="box-more" data-id="' + b.id + '">전체 보기</button><button type="button" class="mini" data-x="box-del" data-id="' + b.id + '">삭제</button></div></div>'; }).join('') + '</div>' : '<div class="empty">아직 저장한 글이 없어요.</div>';
    h += '</section>';
    $('#v-box').innerHTML = h;
  }

  /* ---------- 클릭 처리 ---------- */
  var TOOLNAME = {photo:'사진 홍보', post:'홍보글', sms:'손님 문자', review:'리뷰 답글'};
  document.addEventListener('click', async function(e){
    var t = e.target.closest('[data-view],[data-x]'); if (!t) return;
    if (t.dataset.view){ setView(t.dataset.view); return; }
    var x = t.dataset.x, id = t.dataset.id;
    switch (x){
      case 'goview': setView(t.dataset.v); if (t.dataset.v === 'menu') menuForm(); break;
      case 'mpick': { var m = menuById(id), d = $('#detail'); if (m && d){ var add = m.name + (m.price ? ' ' + fmtPrice(m.price) : ''); d.value = d.value ? d.value + ', ' + add : add; t.setAttribute('aria-pressed', 'true'); } break; }
      case 'box-save': if (!lastText) break; DB.box.unshift({id:uid(), date:ymd(), kind:TOOLNAME[tool] || '글', topic:pick.topic || '', ch:tool === 'post' || tool === 'photo' ? pick.ch : '', text:lastText}); DB.box = DB.box.slice(0, 100); save('box'); toast('보관함에 저장했어요'); break;
      case 'box-copy': { var bx = DB.box.filter(function(b){ return b.id === id; })[0]; if (bx){ try { await navigator.clipboard.writeText(bx.text); toast('복사했어요'); } catch(err){ toast('글을 길게 눌러 복사해 주세요'); } } break; }
      case 'box-more': { var c = t.closest('.item').querySelector('.clip'); c.classList.toggle('clip'); t.textContent = '접기'; break; }
      case 'box-del': DB.box = DB.box.filter(function(b){ return b.id !== id; }); save('box'); renderBox(); toast('삭제했어요'); break;
      /* 메뉴판·전단 */
      case 'bd-kind': bd.head = val('bdHead'); bd.sub = val('bdSub'); bd.kind = t.dataset.v; bd.head = ''; renderBoard(); break;
      case 'bd-sel': { var i = bd.sel.indexOf(id); if (i > -1) bd.sel.splice(i, 1); else bd.sel.push(id); t.setAttribute('aria-pressed', i < 0); break; }
      case 'bd-th': bd.theme = +t.dataset.i; t.parentNode.querySelectorAll('.sw').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); if (!$('#bdRes').classList.contains('hidden')) t.closest('.panel').querySelector('[data-x="bd-make"]').click(); break;
      case 'bd-make': bd.head = val('bdHead'); bd.sub = val('bdSub'); if (!bd.sel.length){ toast('넣을 메뉴를 하나 이상 골라주세요'); break; } await fontsReady(); showImage($('#bdRes'), drawBoard(), studio.name + '_' + bd.kind + '.png', bd.kind); break;
      /* POP */
      case 'pp-sel': { var j = pp.sel.indexOf(id); if (j > -1) pp.sel.splice(j, 1); else { if (pp.sel.length >= 4){ toast('한 장에 4개까지 넣을 수 있어요'); break; } pp.sel.push(id); } t.setAttribute('aria-pressed', j < 0); break; }
      case 'pp-tag': pp.tag = t.dataset.v; t.parentNode.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); break;
      case 'pp-th': pp.theme = +t.dataset.i; t.parentNode.querySelectorAll('.sw').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); break;
      case 'pp-make': if (!pp.sel.length){ toast('메뉴를 골라주세요'); break; } await fontsReady(); showImage($('#ppRes'), drawPop(), studio.name + '_가격표.png', '가격표'); break;
      case 'img-save': if (lastImg) saveCanvas(lastImg.cv, lastImg.name); break;
      case 'img-print': if (lastImg) printCanvas(lastImg.cv); break;
      /* 내 메뉴 */
      case 'menu-add': menuForm(); break;
      case 'menu-edit': menuForm(menuById(id)); break;
      case 'menu-cancel': $('#menuForm').innerHTML = ''; break;
      case 'menu-save': {
        var nm = val('mName'); if (!nm){ toast('메뉴 이름을 적어주세요'); $('#mName').focus(); break; }
        var rec = {id:editMenuId || uid(), name:nm, price:val('mPrice').replace(/,/g, ''), cat:val('mCat') || '메뉴', desc:val('mDesc'), origin:val('mOrigin'), best:$('#mBest').checked};
        if (editMenuId) DB.menus = DB.menus.map(function(m){ return m.id === editMenuId ? rec : m; }); else DB.menus.push(rec);
        save('menus'); renderMenus(); toast('저장했어요'); break;
      }
      case 'menu-del': DB.menus = DB.menus.filter(function(m){ return m.id !== editMenuId; }); save('menus'); renderMenus(); toast('삭제했어요'); break;
      /* 장부 */
      case 'lsub': lsub = t.dataset.v; editQ = null; renderLedger(); break;
      case 'mon': lmon = shiftMon(lmon, +t.dataset.d); renderLedger(); break;
      case 'lf': lfilter = t.dataset.v; renderBook(); break;
      case 'book-add': bookForm(null); break;
      case 'book-edit': bookForm(DB.ledger.filter(function(r){ return r.id === id; })[0]); break;
      case 'bk-type': bkType = t.dataset.v; t.parentNode.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); break;
      case 'book-cancel': $('#bookForm').innerHTML = ''; break;
      case 'book-save': {
        var amt = num(val('bAmt')); if (!amt){ toast('금액을 적어주세요'); $('#bAmt').focus(); break; }
        var row = {id:editRowId || uid(), date:val('bDate') || ymd(), type:bkType, party:val('bParty'), item:val('bItem'), amount:amt, paid:$('#bPaid').checked, memo:val('bMemo')};
        if (editRowId) DB.ledger = DB.ledger.map(function(r){ return r.id === editRowId ? row : r; }); else DB.ledger.push(row);
        if (row.party && !DB.parties.some(function(p){ return p.name === row.party; })) { DB.parties.push({id:uid(), kind:row.type === '매입' ? '식자재' : '기타', name:row.party, items:'', phone:'', day:'', memo:''}); save('parties'); }
        save('ledger'); lmon = row.date.slice(0, 7); renderBook(); toast('장부에 적었어요'); break;
      }
      case 'book-del': DB.ledger = DB.ledger.filter(function(r){ return r.id !== editRowId; }); save('ledger'); renderBook(); toast('삭제했어요'); break;
      case 'paid': DB.ledger.forEach(function(r){ if (r.id === id) r.paid = !r.paid; }); save('ledger'); ({sum:renderSum, book:renderBook})[lsub](); break;
      case 'csv': csv(); break;
      case 'wipe': if (!wipeArm){ wipeArm = true; renderSum(); $('#lbody details').open = true; break; } wipeArm = false; DB.ledger = []; DB.parties = []; DB.quotes = []; save('ledger'); save('parties'); save('quotes'); renderLedger(); toast('예시를 지웠어요. 이제 내 가게 장부예요'); break;
      /* 거래처 */
      case 'party-add': partyForm(); break;
      case 'party-edit': partyForm(DB.parties.filter(function(p){ return p.id === id; })[0]); break;
      case 'pt-kind': ptKind = t.dataset.v; t.parentNode.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); break;
      case 'party-cancel': $('#partyForm').innerHTML = ''; break;
      case 'party-save': {
        var pn = val('pName'); if (!pn){ toast('이름을 적어주세요'); $('#pName').focus(); break; }
        var pr = {id:editPartyId || uid(), kind:ptKind, name:pn, items:val('pItems'), day:val('pDay'), phone:val('pPhone'), memo:val('pMemo')};
        if (editPartyId) DB.parties = DB.parties.map(function(p){ return p.id === editPartyId ? pr : p; }); else DB.parties.push(pr);
        save('parties'); renderParty(); toast('저장했어요'); break;
      }
      case 'party-del': DB.parties = DB.parties.filter(function(p){ return p.id !== editPartyId; }); save('parties'); renderParty(); toast('삭제했어요'); break;
      case 'party-msg': { var p = DB.parties.filter(function(q){ return q.id === id; })[0], box = $('#pm_' + id); if (!p) break; if (box.innerHTML){ box.innerHTML = ''; break; } box.innerHTML = '<textarea id="pmt_' + id + '" aria-label="주문 문자" style="margin-top:6px"></textarea><div class="row" style="margin-top:6px"><button type="button" class="sub primary" data-x="party-msg-copy" data-id="' + id + '">복사하기</button></div><p class="note">[ ] 칸을 채운 뒤 복사해서 문자·카톡에 붙여 넣으세요.</p>'; $('#pmt_' + id).value = orderMsg(p); break; }
      case 'party-msg-copy': try { await navigator.clipboard.writeText($('#pmt_' + id).value); toast('복사했어요'); } catch(err){ toast('글을 길게 눌러 복사해 주세요'); } break;
      case 'party-book': { var pb = DB.parties.filter(function(q){ return q.id === id; })[0]; bookForm(null, {party:pb.name, type:pb.kind === '식자재' ? '매입' : '매출', item:pb.items}); break; }
      case 'party-quote': { var pq = DB.parties.filter(function(q){ return q.id === id; })[0]; quoteEditor(null); setVal('qCus', pq.name); setVal('qPhone', pq.phone); readQ(); break; }
      /* 견적서 */
      case 'quote-new': quoteEditor(null); break;
      case 'quote-open': quoteEditor(DB.quotes.filter(function(q){ return q.id === id; })[0]); break;
      case 'q-st': readQ(); editQ.status = t.dataset.v; t.parentNode.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', b === t); }); break;
      case 'q-addmenu': { readQ(); var qm = menuById(id); editQ.items.push({name:qm.name, qty:num(editQ.people) || 1, price:num(qm.price)}); drawQRows(); break; }
      case 'q-addrow': readQ(); editQ.items.push({name:'', qty:1, price:0}); drawQRows(); var last = document.querySelectorAll('.qN'); last[last.length - 1].focus(); break;
      case 'q-rm': readQ(); editQ.items.splice(+t.dataset.i, 1); drawQRows(); break;
      case 'q-save': if (saveQ()) { lsub = 'quote'; renderLedger(); } break;
      case 'q-img': if (!saveQ(true)) break; await fontsReady(); showImage($('#qRes'), drawQuote(editQ), studio.name + '_견적서_' + editQ.customer + '.png', '견적서'); break;
      case 'q-text': if (!saveQ(true)) break; try { await navigator.clipboard.writeText(quoteText(editQ)); toast('견적 내용을 복사했어요'); } catch(err){ var r = $('#qRes'); r.classList.remove('hidden'); r.innerHTML = '<div class="out">' + esc(quoteText(editQ)) + '</div><p class="note">글을 길게 눌러 복사해 주세요.</p>'; } break;
      case 'q-book':
        if (!saveQ(true)) break;
        if (editQ.booked){ toast('이미 장부에 넣었어요'); break; }
        if (!qTotal(editQ)){ toast('품목과 금액을 먼저 채워주세요'); break; }
        DB.ledger.push({id:uid(), date:editQ.date || ymd(), type:'매출', party:editQ.customer, item:'단체주문 ' + (editQ.people ? editQ.people + '명' : ''), amount:qTotal(editQ), paid:false, memo:'견적서에서 넣음'});
        editQ.booked = true; if (editQ.status === '견적') editQ.status = '확정'; saveQ(true); save('ledger'); toast('장부에 매출로 넣었어요 (받을 돈)'); break;
      case 'q-del': DB.quotes = DB.quotes.filter(function(q){ return q.id !== editQ.id; }); save('quotes'); lsub = 'quote'; editQ = null; renderLedger(); toast('삭제했어요'); break;
    }
  });
  document.addEventListener('change', function(e){ if (e.target.id === 'bdUsePh') bd.usePh = e.target.checked; });

  /* 로그인 회원의 가게 정보(서버) ↔ 이 화면 */
  window.addEventListener('alajoom:profile', function(e){
    var p = e.detail || {}, saved = store.get('studio', null), local = saved && saved.name && saved.name !== CFG.studio.name;
    if (p.studio && p.studio.name){ studio = p.studio; }
    else if (local){ try { window.dispatchEvent(new CustomEvent('alajoom:studio-saved', {detail: saved})); } catch(err){} return; }
    else if (p.store_name){ studio = { name:p.store_name, area:p.area || '', cls:'', feat:'', contact:'', tone:(saved && saved.tone) || CFG.studio.tone }; toast('가입 때 적은 가게 정보를 불러왔어요'); }
    else return;
    store.set('studio', studio); renderStudio();
  });
  renderStudio(); renderQuota(); renderPanel();
  (function(){ var mt = location.search.match(/[?&]view=(promo|menu|ledger|box)/); setView(mt ? mt[1] : 'home'); })();
  $('#mode').textContent = CFG.offline;
  if (window.claude && window.claude.use){
    window.claude.use('sample').then(function(s){ sample = s; $('#mode').textContent = s ? 'AI 직원이 연결돼 있어요 · 시제품' : CFG.offline; }).catch(function(){});
    window.claude.use('downloads').then(function(d){ downloads = d; }).catch(function(){});
  }
})();
</script>
